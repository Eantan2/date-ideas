<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Date Ideas">
<meta name="theme-color" content="#FBF1E8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Date Ideas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top">
    <div class="top-in">
      <div class="title-row">
        <h1>Date Ideas</h1>
        <div class="btns">
          <button id="refreshBtn" class="pill" aria-label="Refresh">↻</button>
          <button id="filterBtn" class="pill">Filter</button>
        </div>
      </div>
      <div id="tabs" class="tabs">
        <button data-tab="todo">To do</button>
        <button data-tab="done">Done</button>
        <button data-tab="all">All</button>
      </div>
      <div id="banner" class="banner hidden"></div>
    </div>
  </div>

  <main>
    <input id="search" type="search" placeholder="Search ideas…" autocomplete="off" autocapitalize="none">
    <div id="migrate" class="migrate hidden"></div>
    <div id="list"></div>
    <div id="foot" class="foot"></div>
  </main>

  <button id="addBtn" class="fab" aria-label="Add">+</button>

  <nav id="nav" class="nav">
    <button data-view="ideas">💡 Ideas</button>
    <button data-view="recipes">🍳 Recipes</button>
  </nav>

  <div id="sheet" class="sheet hidden">
    <div id="sheetInner" class="sheet-inner"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Supabase library (loaded from the jsDelivr CDN), then your settings, then the app -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="mascot.js"></script>
  <script src="import.js"></script>
  <script src="extras.js"></script>
  <script src="app.js"></script>
</body>
</html>
