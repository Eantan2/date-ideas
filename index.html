<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Date Ideas">
<meta name="theme-color" content="#fff7f8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Date Ideas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top">
    <div class="top-in">
      <div class="title-row">
        <h1>Date Ideas 💕</h1>
        <button id="filterBtn" class="pill">Filter</button>
      </div>
      <div id="tabs" class="tabs">
        <button data-tab="todo">To do</button>
        <button data-tab="done">Done</button>
        <button data-tab="all">All</button>
      </div>
    </div>
  </div>

  <main id="list"></main>

  <button id="addBtn" class="fab" aria-label="Add idea">+</button>

  <div id="sheet" class="sheet hidden">
    <div id="sheetInner" class="sheet-inner"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
